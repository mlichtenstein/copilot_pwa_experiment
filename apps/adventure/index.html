<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#31534a">
  <link rel="manifest" href="manifest.json">
  <title>Fizz &amp; Fortune</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; padding: 1rem 0; box-sizing: border-box; display: grid; place-items: center; background: #edf4ef; color: #203a32; }
    main { width: min(42rem, calc(100% - 2rem)); padding: 1.5rem; box-sizing: border-box; background: white; border-radius: 1.25rem; box-shadow: 0 1rem 3rem #203a321c; }
    h1, h2 { margin-top: 0; }
    h1 { text-align: center; }
    h2 { margin-bottom: .5rem; font-size: 1.1rem; }
    section { margin-top: 1.25rem; }
    .choices { display: flex; flex-wrap: wrap; gap: .65rem; }
    button { min-height: 2.8rem; padding: .7rem 1rem; border: 0; border-radius: .75rem; background: #356c59; color: white; font: inherit; font-weight: 650; cursor: pointer; }
    button:hover:not(:disabled), button[aria-pressed="true"] { background: #244d3e; }
    button:focus-visible { outline: .2rem solid #d58c36; outline-offset: .2rem; }
    button:disabled { cursor: default; opacity: .72; }
    #sentence-action { width: 100%; min-height: 3.5rem; margin-top: 1rem; background: #e3e9e4; color: #203a32; text-align: left; font-weight: 700; }
    #sentence-action.is-valid { background: #f3cb6d; opacity: 1; animation: sentence-ready .35s ease-out; }
    #sentence-action.is-complete { background: #72b887; color: #102d1b; opacity: 1; }
    .sentence-connector { color: #68756d; font-weight: 400; }
    @keyframes sentence-ready { from { transform: scale(.98); } to { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { #sentence-action.is-valid { animation: none; } }
    #room-description { line-height: 1.5; }
    .transcript { height: 10rem; max-height: 35vh; overflow-y: auto; overscroll-behavior: contain; padding: .85rem; border-radius: .75rem; background: #edf4ef; }
    .transcript:focus-visible { outline: .2rem solid #d58c36; }
    .transcript-empty { margin: 0; color: #68756d; }
    #transcript-entries { margin: 0; padding: 0; list-style: none; }
    .transcript-turn { padding: 0 0 .75rem; }
    .transcript-turn + .transcript-turn { padding-top: .75rem; border-top: 1px solid #cbd8cf; }
    .transcript-turn p { margin: 0; line-height: 1.5; }
    .transcript-command { color: #244d3e; font-weight: 700; }
    .transcript-response { padding-left: 1.25rem; }
    #sentence-action { position: sticky; bottom: 1rem; z-index: 1; }
    #message { min-height: 3em; padding: .85rem; border-radius: .75rem; background: #edf4ef; line-height: 1.5; }
    @media (prefers-color-scheme: dark) {
      body { background: #17251f; color: #edf7f0; }
      main { background: #263a31; }
      .transcript { background: #1c2e25; }
      .transcript-command { color: #b8e2c8; }
      .transcript-turn + .transcript-turn { border-color: #456052; }
      #message { background: #1c2e25; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Fizz &amp; Fortune</h1>
    <section aria-labelledby="room-name">
      <h2 id="room-name"></h2>
      <p id="room-description"></p>
    </section>
    <section aria-labelledby="transcript-heading">
      <h2 id="transcript-heading">Adventure transcript</h2>
      <div id="transcript" class="transcript" role="region" aria-labelledby="transcript-heading" tabindex="0">
        <p id="transcript-empty" class="transcript-empty">Commands and responses will appear here.</p>
        <ol id="transcript-entries" aria-live="polite" aria-relevant="additions"></ol>
      </div>
    </section>
    <button id="sentence-action" type="button" aria-live="polite" disabled>Choose a verb to make a sentence.</button>
    <p id="message" role="status" aria-live="polite"></p>
    <section aria-labelledby="verbs-heading">
      <h2 id="verbs-heading">Verbs</h2>
      <div class="choices">
        <button type="button" data-verb="examine" aria-pressed="false">Look at</button>
        <button type="button" data-verb="take" aria-pressed="false">Take</button>
        <button type="button" data-verb="use" aria-pressed="false">Use</button>
      </div>
    </section>
    <section aria-labelledby="objects-heading">
      <h2 id="objects-heading">Objects here</h2>
      <div id="room-objects" class="choices"></div>
    </section>
    <section aria-labelledby="inventory-heading">
      <h2 id="inventory-heading">Inventory</h2>
      <div id="inventory-objects" class="choices"></div>
    </section>
  </main>
  <script src="world.js"></script>
  <script src="game-engine.js"></script>
  <script src="adventure-ui.js"></script>
</body>
</html>
