# Purpose: Run Waiting Game rules and player journeys for every change.
# Consumers: GitHub Actions.
# Dependencies: Node built-in test runner; no packages or build step.
name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  waiting-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test apps/waiting-game/game.test.js
