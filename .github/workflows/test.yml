# Purpose: Run Waiting Game rules and player journeys for every change.
# Consumers: GitHub Actions.
# Dependencies: Node built-in test runner; no packages or build step.
name: Test
# Push: any branch, so work is checked before it has a PR.
# Pull request: opened, synchronized (new commits), or reopened (GitHub defaults).
# A commit on an open PR can therefore trigger both runs. Deploy does not depend
# on this separate workflow; it repeats these checks in its own validate job.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  waiting-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Content contracts first; then execute arc journeys and recovery tests.
      - run: node apps/waiting-game/testing/validate.cjs
      - run: node --test apps/waiting-game/*.test.js
      - run: node apps/waiting-game/testing/explore.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waiting-game-test-reports
          path: artifacts/waiting-game/
          if-no-files-found: ignore
          retention-days: 14
