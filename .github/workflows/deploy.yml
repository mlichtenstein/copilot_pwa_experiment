# deploy.yml - GitHub Actions workflow that publishes the app to GitHub Pages.
# Consumer: GitHub itself runs this automatically; nobody invokes it by hand.
#
# How it works: the built site lives on a branch called "gh-pages", which
# GitHub Pages serves as a website. This workflow copies app/ to the site root
# and apps/ to its matching path on that branch:
#   - push to main  -> site root        (https://<owner>.github.io/<repo>/)
#   - pull request  -> previews/pr-N/   (a separate folder per PR)
#   - PR closed     -> that PR's folder is deleted
# Each step only touches its own folder, so production and previews never
# overwrite each other.
name: Deploy

# When to run
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Default read-only: game code runs only in the validate job.
permissions:
  contents: read

# Run one deployment at a time so two runs can't push to gh-pages simultaneously
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate content and test/explore game
        run: |
          node apps/waiting-game/testing/validate.cjs
          node --test apps/waiting-game/*.test.js
          node apps/waiting-game/testing/explore.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waiting-game-deploy-reports
          path: artifacts/waiting-game/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: validate
    if: always() && (needs.validate.result == 'success' || github.event.action == 'closed')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      # Only workflow-owned code executes in this job; no app/test scripts.
      - name: Stamp game build identity
        if: github.event.action != 'closed'
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const commit = cp.execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          const build = {commit, sourceCommit: process.env.GITHUB_HEAD_SHA || commit};
          fs.writeFileSync('apps/waiting-game/build-info.js', '/* Purpose: Identify deployed code. Consumers: debug reports. Dependencies: none. */\nwindow.WaitingGameBuild = ' + JSON.stringify(build) + ';\n');
          NODE

      - name: Prepare gh-pages branch
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add ../gh-pages gh-pages
          else
            git worktree add --orphan -b gh-pages ../gh-pages
          fi

      - name: Publish production (main)
        if: github.event_name == 'push'
        run: |
          # Replace everything except previews/ and git metadata
          find ../gh-pages -mindepth 1 -maxdepth 1 ! -name .git ! -name previews -exec rm -rf {} +
          cp -r app/. ../gh-pages/
          mkdir -p ../gh-pages/apps
          cp -r apps/. ../gh-pages/apps/
          touch ../gh-pages/.nojekyll

      - name: Publish PR preview
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        run: |
          dest=../gh-pages/previews/pr-${{ github.event.pull_request.number }}
          rm -rf "$dest"
          mkdir -p "$dest"
          cp -r app/. "$dest/"
          mkdir -p "$dest/apps"
          cp -r apps/. "$dest/apps/"
          touch ../gh-pages/.nojekyll

      - name: Remove PR preview
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        run: rm -rf ../gh-pages/previews/pr-${{ github.event.pull_request.number }}

      - name: Commit and push
        working-directory: ../gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Deploy ${{ github.sha }}"
          git push origin HEAD:gh-pages

      - name: Post review deployments comment
        if: always() && github.event_name == 'pull_request' && github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          JOB_STATUS: ${{ job.status }}
        run: |
          base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/previews/pr-${PR}"
          files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only || true)
          all=false
          echo "$files" | grep -q '^\.github/' && all=true
          [ -z "$files" ] && all=true

          # name|path in repo|preview URL
          apps="Hello World (site root)|app/|$base/"
          for dir in apps/*/; do
            [ -d "$dir" ] || continue
            slug=${dir#apps/}
            slug=${slug%/}
            case "$slug" in
              counter) name="Counter" ;;
              dice) name="Dice and coin" ;;
              adventure) name="Fizz and Fortune" ;;
              *) name=$(printf '%s' "$slug" | tr '-' ' ' | sed -E 's/(^| )([a-z])/\1\u\2/g') ;;
            esac
            apps+=$'\n'"$name|apps/$slug/|$base/apps/$slug/"
          done

          marker='<!-- review-deployments -->'
          body="$marker"$'\n'"## Review deployments"$'\n\n'
          found=false
          while IFS='|' read -r name path url; do
            name=$(echo "$name" | xargs)
            if [ "$all" = true ] || echo "$files" | grep -q "^$path"; then
              found=true
              if [ "$IS_FORK" = true ]; then
                body+="- $name: no preview (PRs from forks are not deployed)"$'\n'
              elif [ "$JOB_STATUS" = success ]; then
                body+="- $name: $url"$'\n'
              else
                body+="- $name: ❌ deployment failed, no preview available"$'\n'
              fi
            fi
          done <<< "$apps"
          [ "$found" = true ] || body+="No deployable app changed in this PR, so there is no preview."$'\n'
          if [ "$JOB_STATUS" = success ] && [ "$IS_FORK" != true ]; then
            body+=$'\n'"Updated for commit ${{ github.event.pull_request.head.sha }}. Links may take a minute to go live after GitHub Pages rebuilds."
          fi

          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.user.login==\"github-actions[bot]\" and (.body | contains(\"$marker\")))][0].id // empty" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
