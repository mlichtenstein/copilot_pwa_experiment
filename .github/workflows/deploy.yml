# Purpose: Publish app/ at the site root and apps/ under apps/ on the gh-pages branch.
# Consumers: GitHub Actions runs this on push to main and on pull_request events. GitHub Pages serves the branch.
# Dependencies: actions/checkout, actions/upload-artifact, actions/download-artifact, git, and the GitHub CLI (gh).
#
# How it works: the built site lives on a branch called "gh-pages", which
# GitHub Pages serves as a website. This workflow copies app/ to the site root
# and apps/ to its matching path on that branch:
#   - push to main  -> site root        (https://<owner>.github.io/<repo>/)
#   - pull request  -> previews/pr-N/   (a separate folder per PR)
#   - PR closed     -> that PR's folder is deleted
# Each step only touches its own folder, so production and previews never
# overwrite each other. Published copies omit symlinks and names matching
# .git* so those entries from app/ or apps/ are not committed to gh-pages.
# The default token is contents: read. The build job checks out and copies
# files with that read-only token and does not persist it in .git/config.
# Only the deploy job, which pushes gh-pages and posts the review comment,
# has write scopes. Pull requests from forks skip the deploy and push steps.
name: Deploy

# When to run
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Read-only unless a job below opts into a write scope.
permissions:
  contents: read

# Run one deployment at a time so two runs can't push to gh-pages simultaneously
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  # Checkout and copy only. This job never has a write token.
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      orphan: ${{ steps.pack.outputs.orphan }}
      base_sha: ${{ steps.pack.outputs.base_sha }}
    steps:
      # Checkout stays credential-free. Forks still need the tree so the review comment can list apps/.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Skip deploy for fork pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Fork pull request: skipping gh-pages prepare, publish, and push."

      - name: Record app directories for the review comment
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/source-app-index"
          mkdir -p "$root/apps"
          echo ok > "$root/index-ready"
          for dir in apps/*/; do
            [ -d "$dir" ] || continue
            [ -f "${dir}index.html" ] || continue
            mkdir -p "$root/$dir"
            echo ok > "$root/${dir}index-ready"
          done

      - name: Upload app directory index
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: actions/upload-artifact@v4
        with:
          name: source-app-index
          path: ${{ runner.temp }}/source-app-index
          if-no-files-found: error
          retention-days: 1

      - name: Prepare gh-pages branch
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add ../gh-pages gh-pages
          else
            git worktree add --orphan -b gh-pages ../gh-pages
          fi

      - name: Publish production (main)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          copy_published() {
            local src=$1 dest=$2 stage
            stage=$(mktemp -d)
            cp -r "$src/." "$stage/"
            find "$stage" -mindepth 1 -depth \( -name '.git*' -o -type l \) -exec rm -rf {} +
            mkdir -p "$dest"
            cp -r "$stage/." "$dest/"
            rm -rf "$stage"
          }
          # Replace everything except previews/ and git metadata
          find ../gh-pages -mindepth 1 -maxdepth 1 ! -name .git ! -name previews -exec rm -rf {} +
          copy_published app ../gh-pages
          copy_published apps ../gh-pages/apps
          touch ../gh-pages/.nojekyll

      - name: Publish PR preview
        if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ ! "$PR" =~ ^[0-9]+$ ]]; then
            echo "Pull request number must be digits only" >&2
            exit 1
          fi
          copy_published() {
            local src=$1 dest=$2 stage
            stage=$(mktemp -d)
            cp -r "$src/." "$stage/"
            find "$stage" -mindepth 1 -depth \( -name '.git*' -o -type l \) -exec rm -rf {} +
            mkdir -p "$dest"
            cp -r "$stage/." "$dest/"
            rm -rf "$stage"
          }
          dest="../gh-pages/previews/pr-${PR}"
          rm -rf "$dest"
          copy_published app "$dest"
          copy_published apps "$dest/apps"
          touch ../gh-pages/.nojekyll

      - name: Remove PR preview
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ ! "$PR" =~ ^[0-9]+$ ]]; then
            echo "Pull request number must be digits only" >&2
            exit 1
          fi
          rm -rf "../gh-pages/previews/pr-${PR}"

      - name: Pack gh-pages tree
        id: pack
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          if git -C ../gh-pages rev-parse --verify HEAD >/dev/null 2>&1; then
            echo "orphan=false" >> "$GITHUB_OUTPUT"
            echo "base_sha=$(git -C ../gh-pages rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "orphan=true" >> "$GITHUB_OUTPUT"
            echo "base_sha=" >> "$GITHUB_OUTPUT"
          fi
          tar --exclude=.git -C ../gh-pages -cf gh-pages.tar .

      - name: Upload gh-pages tree
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: gh-pages-tree
          path: gh-pages.tar
          if-no-files-found: error
          retention-days: 1

  # Push the packed tree and post the review comment. Fork pull requests skip the push.
  deploy:
    needs: build
    if: always() && !cancelled() && ((github.event_name == 'push' && needs.build.result == 'success') || github.event_name == 'pull_request')
    permissions:
      contents: write
      pull-requests: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        if: needs.build.result == 'success' && needs.build.outputs.orphan != 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.base_sha }}
          persist-credentials: false

      - name: Initialize gh-pages
        if: needs.build.result == 'success' && needs.build.outputs.orphan == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          set -euo pipefail
          git init -b gh-pages
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Download gh-pages tree
        if: needs.build.result == 'success' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/download-artifact@v4
        with:
          name: gh-pages-tree
          path: ${{ runner.temp }}/gh-pages-tree

      - name: Commit and push
        if: needs.build.result == 'success' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_TAR: ${{ runner.temp }}/gh-pages-tree/gh-pages.tar
          DEPLOY_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xf "$SITE_TAR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Deploy ${DEPLOY_SHA}"
          # The helper reads GH_TOKEN when it runs. The token is not written to .git/config.
          git -c credential.helper= \
            -c 'credential.helper=!f() { echo username=x-access-token; printf "pass%s=%s\n" word "$(printenv GH_TOKEN)"; }; f' \
            push origin HEAD:gh-pages
          echo "PUSHED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # Pushing to gh-pages starts GitHub's own "pages-build-deployment" run.
      # A second push while it is still running makes that run fail with
      # "due to in progress deployment", so hold the concurrency lock until it ends.
      - name: Wait for GitHub Pages deployment
        if: env.PUSHED_SHA != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$PUSHED_SHA&event=dynamic" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment")] | first | [.status // "pending", .conclusion // "pending"] | @tsv')
            read -r status conclusion <<< "$result"
            echo "Pages deployment status: $status"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] && exit 0
              echo "GitHub Pages deployment failed: $conclusion" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for Pages deployment" >&2
          exit 1

      - name: Download app directory index
        if: always() && github.event_name == 'pull_request' && github.event.action != 'closed'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: source-app-index
          path: ${{ runner.temp }}/source-app-index

      - name: Ensure app directory index
        if: always() && github.event_name == 'pull_request' && github.event.action != 'closed'
        run: mkdir -p "${{ runner.temp }}/source-app-index/apps"

      - name: Post review deployments comment
        if: always() && github.event_name == 'pull_request' && github.event.action != 'closed'
        working-directory: ${{ runner.temp }}/source-app-index
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          JOB_STATUS: ${{ needs.build.result == 'success' && job.status == 'success' && 'success' || 'failure' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_RECEIVED_AT: ${{ contains(fromJSON('["opened","synchronize"]'), github.event.action) && github.event.pull_request.updated_at || '' }}
        run: |
          set -euo pipefail
          base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/previews/pr-${PR}"
          files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only || true)
          all=false
          echo "$files" | grep -q '^\.github/' && all=true
          [ -z "$files" ] && all=true

          # name|path in repo|preview URL
          apps="Hello World (site root)|app/|$base/"
          for dir in apps/*/; do
            [ -d "$dir" ] || continue
            [ -f "${dir}index.html" ] || continue
            slug=${dir#apps/}
            slug=${slug%/}
            case "$slug" in
              counter) name="Counter" ;;
              dice) name="Dice and coin" ;;
              adventure) name="Fizz and Fortune" ;;
              *) name=$(printf '%s' "$slug" | tr '-' ' ' | sed -E 's/(^| )([a-z])/\1\u\2/g') ;;
            esac
            apps+=$'\n'"$name|apps/$slug/|$base/apps/$slug/"
          done

          marker='<!-- review-deployments -->'
          body="$marker"$'\n'"## Review deployments"$'\n\n'
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -z "$PUSH_RECEIVED_AT" ]; then
            # reopened events carry no push time; fall back to the head commit's committer date
            PUSH_RECEIVED_AT=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq '.commit.committer.date' 2>/dev/null || true)
          fi
          if [ -n "$PUSH_RECEIVED_AT" ]; then
            PUSH_RECEIVED_PT=$(TZ=America/Los_Angeles date -d "$PUSH_RECEIVED_AT" '+%Y-%m-%d %H:%M:%S %Z' 2>/dev/null || echo "$PUSH_RECEIVED_AT (UTC)")
            body+="Latest commit pushed (Pacific): $PUSH_RECEIVED_PT"$'\n'
          else
            body+="Latest commit push time unavailable for this PR event."$'\n'
          fi
          COMMIT_MSG=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq '.commit.message | split("\n")[0]' 2>/dev/null || true)
          if [ -n "$COMMIT_MSG" ]; then
            body+="Commit: $HEAD_SHA — $COMMIT_MSG"$'\n'
          else
            body+="Commit: $HEAD_SHA"$'\n'
          fi
          if [ "$IS_FORK" = true ]; then
            body+="Status: no preview for fork PRs."$'\n\n'
          elif [ "$JOB_STATUS" = success ]; then
            body+="Status: ✅ deployment succeeded. [Workflow]($run_url)"$'\n\n'
          else
            body+="Status: ❌ deployment failed or was cancelled; preview may be missing or outdated. [View logs]($run_url)"$'\n\n'
          fi
          found=false
          while IFS='|' read -r name path url; do
            name=$(echo "$name" | xargs)
            if [ "$all" = true ] || echo "$files" | grep -q "^$path"; then
              found=true
              if [ "$IS_FORK" = true ]; then
                body+="- $name: no preview (PRs from forks are not deployed)"$'\n'
              elif [ "$JOB_STATUS" = success ]; then
                body+="- $name: $url"$'\n'
              else
                body+="- $name: ❌ deployment failed, no preview available"$'\n'
              fi
            fi
          done <<< "$apps"
          [ "$found" = true ] || body+="No deployable app changed in this PR, so there is no preview."$'\n'
          if [ "$JOB_STATUS" = success ] && [ "$IS_FORK" != true ]; then
            body+=$'\n'"Updated for commit ${HEAD_SHA}${COMMIT_MSG:+ ($COMMIT_MSG)}. Links may take a minute to go live after GitHub Pages rebuilds."
          fi

          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.user.login==\"github-actions[bot]\" and (.body | contains(\"$marker\")))][0].id // empty" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null || comment_rc=$?
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body" || comment_rc=$?
          fi
          if [ "${comment_rc:-0}" -ne 0 ]; then
            if [ "$IS_FORK" = true ]; then
              echo "Fork pull request: the review comment was not posted because the token is read-only. Continuing."
              exit 0
            fi
            exit "$comment_rc"
          fi

      - name: Fail when the site was not built
        if: always() && needs.build.result != 'success' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        run: exit 1
