# deploy.yml - GitHub Actions workflow that publishes the app to GitHub Pages.
# Consumer: GitHub itself runs this automatically; nobody invokes it by hand.
#
# How it works: the built site lives on a branch called "gh-pages", which
# GitHub Pages serves as a website. This workflow copies the app/ folder into
# that branch:
#   - push to main  -> site root        (https://<owner>.github.io/<repo>/)
#   - pull request  -> previews/pr-N/   (a separate folder per PR)
#   - PR closed     -> that PR's folder is deleted
# Each step only touches its own folder, so production and previews never
# overwrite each other.
name: Deploy

# When to run
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

# contents: write lets us push to gh-pages; pull-requests: write lets us comment
permissions:
  contents: write
  pull-requests: write

# Run one deployment at a time so two runs can't push to gh-pages simultaneously
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare gh-pages branch
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add ../gh-pages gh-pages
          else
            git worktree add --orphan -b gh-pages ../gh-pages
          fi

      - name: Publish production (main)
        if: github.event_name == 'push'
        run: |
          # Replace everything except previews/ and git metadata
          find ../gh-pages -mindepth 1 -maxdepth 1 ! -name .git ! -name previews -exec rm -rf {} +
          cp -r app/. ../gh-pages/
          touch ../gh-pages/.nojekyll

      - name: Publish PR preview
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        run: |
          dest=../gh-pages/previews/pr-${{ github.event.pull_request.number }}
          rm -rf "$dest"
          mkdir -p "$dest"
          cp -r app/. "$dest/"
          touch ../gh-pages/.nojekyll

      - name: Remove PR preview
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        run: rm -rf ../gh-pages/previews/pr-${{ github.event.pull_request.number }}

      - name: Commit and push
        working-directory: ../gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Deploy ${{ github.sha }}"
          git push origin HEAD:gh-pages

      - name: Comment preview URL
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owner=${GITHUB_REPOSITORY_OWNER}
          repo=${GITHUB_REPOSITORY#*/}
          gh pr comment ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" \
            --body "Preview: https://$owner.github.io/$repo/previews/pr-${{ github.event.pull_request.number }}/"
