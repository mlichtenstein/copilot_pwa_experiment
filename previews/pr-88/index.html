<!--
  index.html - the single page of the app.
  Consumers: the browser (any phone or desktop) loads this file when someone
  visits the site. It pulls in style.css (looks), app.js (behavior) and
  manifest.webmanifest (tells Android how to install the app).
  All links are RELATIVE (no leading "/") so the page works whether it is
  served from the site root (production) or from /previews/pr-N/ (a preview).
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Makes the page fit phone screens instead of being zoomed out -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Colors the browser/address bar on Android -->
  <meta name="theme-color" content="#1a73e8">
  <title>Hello World PWA</title>
  <!-- Makes the app installable ("Add to Home screen") -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Hello World!</h1>
    <p>Count: <span id="count">0</span></p>
    <button id="increment" type="button">Increment</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
