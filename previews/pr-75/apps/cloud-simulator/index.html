<!DOCTYPE html>
<!-- Purpose: Cloud simulator entry point (the manifest's start_url and the app folder's
     link): sends visitors straight on to Noise weather. Consumers: browser.
     Dependencies: noise.html, manifest.json, icon.svg. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111c30">
  <title>Cloud Simulator</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta http-equiv="refresh" content="0; url=noise.html">
  <script>location.replace("noise.html");</script>
</head>
<body>
  <p>Opening <a href="noise.html">Noise weather</a>…</p>
</body>
</html>
